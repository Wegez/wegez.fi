<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Snake</title>
<style>
html,body{margin:0;padding:0;height:100%;display:flex;justify-content:center;align-items:flex-start;background:#111;font-family:sans-serif;color:#eee}
.wrap{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
#score{font-size:24px;font-weight:600;margin-bottom:4px}
canvas{background:#000;border-radius:14px;touch-action:none;display:block}
.controls{display:flex;gap:12px;margin-top:10px}
.download-link,.nav-link,.restart-btn{padding:10px 20px;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:opacity .2s;font-family:sans-serif}
.download-link:active,.nav-link:active,.restart-btn:active{opacity:.8}
.download-link{background:#4ab3ff;color:#000}
.nav-link{background:#ffb84a;color:#000}
.restart-btn{background:#fff;color:#000;margin-top:20px}
.canvas-container{position:relative;border-radius:14px;overflow:hidden}
.game-over-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,.85);color:#fff;text-align:center;z-index:10;pointer-events:none;opacity:0;transition:opacity 0.2s}
.game-over-overlay.visible{pointer-events:auto;opacity:1}
.game-over-text{font-size:48px;margin-bottom:10px}
.final-score-text{font-size:28px;color:#79f}
</style>
</head>
<body>

<div class="wrap">
<div id="score">Score: 0 | High Score: 0</div>
<div class="canvas-container">
<canvas id="c"></canvas>
<div id="gameOverOverlay" class="game-over-overlay">
<div class="game-over-text">GAME OVER</div>
<div id="finalScore" class="final-score-text">Score: 0</div>
<button id="restartBtn" class="restart-btn">Restart Game</button>
</div>
</div>
<div class="controls">
<a href="https://wegez.fi/files/Kesaillan_valssi.pdf" class="download-link" target="_blank" rel="noopener noreferrer">View PDF</a>
<a href="/timestamps" class="nav-link">Timestamp Generator</a>
</div>
</div>

<script>
const CELL=20,COLS=20,ROWS=28,SPEED=9,OFF=10;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const finalScoreEl=document.getElementById('finalScore');
const restartBtn=document.getElementById('restartBtn');

canvas.width=COLS*CELL+OFF*2;
canvas.height=ROWS*CELL+OFF*2;

let snake,snakeSet,dir,food,score=0,highScore=0,running=false,started=false;
let lastTime=0,accumulator=0,inputQueue=[];
const frameDelay=1000/SPEED;

try {
    highScore=parseInt(localStorage.getItem('snakeHighScore'))||0;
} catch(e) {
    highScore=0;
}

function updateScore(){
    scoreEl.textContent=`Score: ${score} | High Score: ${highScore}`;
}

function reset(){
    snake=[{x:10,y:14},{x:9,y:14},{x:8,y:14}];
    snakeSet=new Set(snake.map(s=>s.x+","+s.y));
    dir={x:1,y:0};
    inputQueue=[];
    food=randFood();
    score=0;
    running=true;
    started=false;
    lastTime=0;
    accumulator=0;
    gameOverOverlay.classList.remove('visible');
    updateScore();
    draw();
}

function randFood(){
    let f;
    do {
        f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    } while(snakeSet.has(f.x+","+f.y));
    return f;
}

function keyToDir(key){
    const keys={'arrowup':{x:0,y:-1},'w':{x:0,y:-1},'arrowdown':{x:0,y:1},'s':{x:0,y:1},'arrowleft':{x:-1,y:0},'a':{x:-1,y:0},'arrowright':{x:1,y:0},'d':{x:1,y:0}};
    return keys[key]||null;
}

function step(){
    if(inputQueue.length>0){
        const next=inputQueue.shift();
        if(!(next.x===-dir.x&&next.y===-dir.y)) dir=next;
    }

    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snakeSet.has(head.x+","+head.y)){
        return gameOver();
    }

    snake.unshift(head);
    snakeSet.add(head.x+","+head.y);

    if(head.x===food.x&&head.y===food.y){
        score++;
        if(score>highScore){
            highScore=score;
            try{localStorage.setItem('snakeHighScore',highScore);}catch(e){}
        }
        updateScore();
        food=randFood();
    }else{
        const tail=snake.pop();
        snakeSet.delete(tail.x+","+tail.y);
    }
}

function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle='#f4a261';
    ctx.fillRect(food.x*CELL+OFF+2,food.y*CELL+OFF+2,CELL-4,CELL-4);

    snake.forEach((p,i)=>{
        ctx.fillStyle=i===0?'#79f':'#4ab3ff';
        ctx.fillRect(p.x*CELL+OFF+1,p.y*CELL+OFF+1,CELL-2,CELL-2);
    });

    ctx.lineWidth=4;
    ctx.strokeStyle='#123';
    ctx.beginPath();
    ctx.roundRect(OFF-2,OFF-2,COLS*CELL+4,ROWS*CELL+4,6);
    ctx.stroke();

    if(!started&&running){
        ctx.fillStyle="rgba(255,255,255,0.7)";
        ctx.font="18px sans-serif";
        ctx.textAlign="center";
        ctx.fillText("Press arrow keys to start",canvas.width/2,canvas.height/2);
    }
}

function loop(t){
    requestAnimationFrame(loop);
    if(!running||!started) return;
    if(!lastTime) lastTime=t;
    accumulator+=t-lastTime;
    lastTime=t;
    while(accumulator>=frameDelay){
        step();
        accumulator-=frameDelay;
    }
    draw();
}

function gameOver(){
    running=false;
    finalScoreEl.textContent='Score: '+score;
    gameOverOverlay.classList.add('visible');
}

window.addEventListener('keydown',e=>{
    const newDir=keyToDir(e.key.toLowerCase());
    if(!newDir) return;
    e.preventDefault();
    if(!started&&running){
        started=true;
        lastTime=performance.now();
    }
    const lastQueued=inputQueue.length>0?inputQueue[inputQueue.length-1]:dir;
    if(newDir.x!==lastQueued.x||newDir.y!==lastQueued.y){
        if(inputQueue.length<2) inputQueue.push(newDir);
    }
});

restartBtn.addEventListener('click',reset);
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
